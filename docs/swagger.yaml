        type: string
      new:
        type: string
      old:
        type: string
    type: object
  request.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  request.UserRegistrationRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  request.UserUpdateRequest:
    properties:
      username:
        type: string
    type: object
  request.VoterRegistrationRequest:
    properties:
      is_registered:
        type: boolean
      nik:
        type: string
      region:
        type: string
      signed_transaction:
        type: string
      voter_address:
        type: string
    type: object
  response.KPUKotaRegistrationResponse:
    properties:
      address:
        type: string
      is_active:
        type: boolean
    type: object
  response.KPUKotaResponse:
    properties:
      address:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      region:
        type: string
    type: object
  response.KPUProvinsiRegistrationResponse:
    properties:
      address:
        type: string
      is_active:
        type: boolean
    type: object
  response.KPUProvinsiResponse:
    properties:
      address:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      region:
        type: string
    type: object
  response.UserLoginResponse:
