basePath: /
definitions:
  controller.errorResponse:
    properties:
      error_code:
        type: integer
      error_message:
        type: string
    type: object
  controller.jsonResponse:
    properties:
      code:
        type: integer
      data: {}
      error:
        $ref: '#/definitions/controller.errorResponse'
      message:
        type: string
    type: object
  request.UserLoginRequest:
    properties:
      nik:
        type: string
      password:
        type: string
    type: object
  request.UserRegisterRequest:
    properties:
      name:
        type: string
      nik:
        type: string
    type: object
  response.UserLoginResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  response.UserRegistrationResponse:
    properties:
      nik:
        type: string
    type: object
  response.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      nik:
        type: string
      no_telephone:
        type: string
    type: object
info:
  contact: {}
  description: User Management System Service.
  title: UMS Service
  version: 1.0.0
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Ping to check health
      parameters:
      - description: user that make request
        in: header
        name: X-User-Id
        type: string
      - default: web
        description: channel where request comes from
        in: header
        name: X-Channel-Id
        type: string
      - description: request unique identifier
        in: header
        name: X-Request-Id
        type: string
      - description: user account
        in: header
        name: X-Account-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.jsonResponse'
      summary: Ping
      tags:
      - Health
  /v1/login:
    post:
      consumes:
      - application/json
      description: Login user
      parameters:
      - default: web
        description: channel where request comes from
        in: header
        name: X-Channel-Id
        type: string
      - description: Login Payload
        in: body
        name: users
        required: true
        schema:
          $ref: '#/definitions/request.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.jsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserLoginResponse'
              type: object
      summary: Login User
      tags:
      - users
  /v1/register:
    post:
      consumes:
      - application/json
      description: Register new user
      parameters:
      - default: web
        description: channel where request comes from
        in: header
        name: X-Channel-Id
        type: string
      - description: Register Request
        in: body
        name: users
        required: true
        schema:
          $ref: '#/definitions/request.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.jsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserRegistrationResponse'
              type: object
      summary: Register User
      tags:
      - users
  /v1/users/{nik}:
    get:
      consumes:
      - application/json
      description: Get User BY NIK
      parameters:
      - default: web
        description: channel where request comes from
        in: header
        name: X-Channel-Id
        type: string
      - description: user nik
        in: path
        name: NIK
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.jsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserResponse'
              type: object
      summary: Get User By NIK
      tags:
      - users
  /v1/users/me:
    get:
      consumes:
      - application/json
      description: Get User BY ID
      parameters:
      - default: web
        description: channel where request comes from
        in: header
        name: X-Channel-Id
        type: string
      - description: user id
        in: header
        name: X-User-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.jsonResponse'
            - properties:
                data:
                  $ref: '#/definitions/response.UserResponse'
              type: object
      summary: Get User By ID
      tags:
      - users
swagger: "2.0"
