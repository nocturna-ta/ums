      message:
        type: string
    type: object
  request.KPUKotaRegistrationRequest:
    properties:
      address:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      region:
        type: string
      signed_transaction:
        type: string
    type: object
  request.KPUProvinsiRegistrationRequest:
