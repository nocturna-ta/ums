        type: string
      - description: Role
        in: header
        name: X-Role
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
      summary: Get photo for KPU Kota
      tags:
      - kpu_kota
    post:
      consumes:
      - multipart/form-data
      description: Upload a photo for a KPU Kota
      parameters:
      - description: User ID
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: Public Address
        in: header
        name: X-Address-Id
        type: string
      - description: Role
        in: header
        name: X-Role
        type: string
      - description: Photo file (jpg, jpeg, png only)
        in: formData
        name: photo
        required: true
        type: file
      produces:
