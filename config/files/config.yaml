Server:
  Port: 8900
  ReadTimeout: 15s
  WriteTimeout: 15s

API:
  BasePath: ""
  APITimeout: 15s
  EnableSwagger: true

Database:
  SlaveDSN: "postgres://postgres:1235813@localhost:5433/ums?sslmode=disable"
  MasterDSN: "postgres://postgres:1235813@localhost:5433/ums?sslmode=disable"
  RetryInterval: 10
  MaxIdleConn: 10
  MaxConn: 10
  ConnMaxLifetime: 10s

DatabaseClickhouse:
  SlaveDSN: "clickhouse://default:changeme@localhost:19000/user_logs"
  MasterDSN: "clickhouse://default:changeme@localhost:19000/user_logs"
  RetryInterval: 10
  MaxIdleConn: 10
  MaxConn: 10
  ConnMaxLifetime: 10s

Kafka:
  Producer:
    Brokers:
      - localhost:9092
    MaxAttempt: 5
    Idempotent: true
  Consumer:
    Brokers:
      - localhost:9092
    ClusterVersion : "3.2.0"
    ConsumerGroup: "ums-service"
    MaxRetries: 3
    WorkerPoolSize: 5
    Retry:
      HandlerTimeout: 20s
      MaxRetry: 3
      RetryInitialDelay: 100ms
      MaxJitter: 500ms
      BackOffConfig:
        - 1m
        - 5m
        - 10m
  Topics:
    MasterDataUser:
      Value: "ums.masterdata-users"
      ErrorHandler: "Phase1"
      WithBackOff: true
    MasterDataVoter:
      Value: "ums.masterdata-voters"
      ErrorHandler: "Phase1"
      WithBackOff: true
    MasterDataKpuKota:
      Value: "ums.masterdata-kpu-kota"
      ErrorHandler: "Phase1"
      WithBackOff: true
    MasterDataKpuProvinsi:
      Value: "ums.masterdata-kpu-provinsi"
      ErrorHandler: "Phase1"
      WithBackOff: true
    UserLogs:
      Value: "ums.user-logs"
      ErrorHandler: "Phase1"
      WithBackOff: true
    VoteSubmitData:
      Value: "votes.submit"
      ErrorHandler: "Phase1"
      WithBackOff: true
    VoteProcessed:
      Value: "votes.processed"
      ErrorHandler: "Phase1"
      WithBackOff: false
    VoteDLQ:
      Value: "votes.dlq"
      ErrorHandler: "Phase1"
      WithBackOff: false

